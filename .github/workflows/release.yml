# ============================================================================
#  打标签即发版
#
#  dist/ 里入库的那份是**框架依赖**版本（体积小、clone 快，但要求先装
#  .NET 10 桌面运行时）。这里额外产出一份**自包含**版本并挂到 Release 上 ——
#  自包含版双击就能跑，不需要用户装任何东西，是给普通玩家的那一份。
#
#  两者都提供，而不是二选一：仓库要能被快速 clone，玩家要能不装环境就能跑。
# ============================================================================

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（例如 v1.0.0）。用于在不重推标签的情况下重跑发版。'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 前端静态检查
        shell: bash
        run: ./check-web.sh

      - name: 发布自包含版本（win-x64）
        shell: bash
        run: |
          set -euo pipefail
          # 刻意不开 PublishReadyToRun：它只影响首次启动的零点几秒，
          # 却要求 SDK 具备 win-x64 的运行时包，多一个可能让首次发版直接失败的环节。
          # 发版链路稳不稳比这点启动开销重要得多。
          dotnet publish src/StarCore.Desktop/StarCore.Desktop.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o out/selfcontained \
            -p:DebugType=none \
            -p:RunAnalyzers=false \
            -m:1

      # 自包含发布不会自动带上 wwwroot（项目里用的是 robocopy 目标，
      # 只在 Build/Publish 之后跑）。漏了它发出去的包就是个空壳。
      - name: 确认界面资源在包里
        shell: bash
        run: |
          if [ ! -f out/selfcontained/wwwroot/index.html ]; then
            echo "界面资源缺失，正在补齐…"
            cp -r src/StarCore.Desktop/wwwroot out/selfcontained/
          fi
          test -f out/selfcontained/wwwroot/index.html
          test -f out/selfcontained/StarCore.exe

      # 打包与校验都用 _tools/ 下的脚本，与本地跑的是同一份逻辑。
      # 之所以不用 7z：它在 Windows 上写出的 zip 条目名用反斜杠
      # （StarCore-win-x64\wwwroot\index.html），在 macOS / Linux 上解压会变成一个
      # 带怪名字的单文件。zipfile 写出的恒是标准 `/`。
      - name: 打包
        shell: bash
        run: |
          set -euo pipefail
          python _tools/make-package.py out/selfcontained \
            out/StarCore-win-x64-selfcontained.zip \
            --prefix StarCore-win-x64
          ls -lh out/*.zip

      # 这一步曾经是这样写的：`7z l <zip> | grep 'wwwroot/index.html'` ——
      # 7z 列出的条目名用反斜杠，正斜杠的 grep 永远匹配不上，于是在 CI 上
      # 必然失败（本地没 7z 所以从没复现过）。现在判定逻辑在
      # _tools/verify-package.py 里，直接读 zip 条目名，与打包器无关。
      # 它还会断言包里真的带运行时 —— 防止把「需要装 .NET」的版本当成
      # 自包含版发出去，那种错只有在别人的机器上才会暴露。
      - name: 校验压缩包内容
        shell: bash
        run: python _tools/verify-package.py out/StarCore-win-x64-selfcontained.zip

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v3
        with:
          # push tag 时取标签名；手动重跑时取输入的标签。
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: out/StarCore-win-x64-selfcontained.zip
          generate_release_notes: true
          draft: false
          body: |
            ## 下载

            `StarCore-win-x64-selfcontained.zip` —— 解压后进入 `StarCore-win-x64` 文件夹，
            双击 `StarCore.exe` 即可运行。**已内置 .NET 运行时，无需另行安装任何环境。**

            ## 系统要求

            - Windows 10 / 11（64 位）
            - 界面基于 WebView2。Win10/11 通常已自带；若提示缺失，安装一次
              [WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/) 即可

            ## 已知限制

            微软账户登录需要 Mojang 的 API 允许列表审核，通过前 `login_with_xbox` 会返回 403。
            离线账户与其余功能不受影响，详见 README 的「已知限制」一节。

            ## 校验

            介意来源的话，可以直接拉源码自行构建（需要 .NET 10 SDK）：

            ```
            ./publish.sh
            ```

            仓库 `dist/` 目录里也放了一份可直接运行的构建产物，同样无需安装运行时。
